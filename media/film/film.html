<script>
const DATA = window.__DATA;
const W = 1920, H = 1080, FPS = 30;
const c = document.getElementById('c'), x = c.getContext('2d');

let seedv = 11; const rnd = () => (seedv = (seedv * 16807) % 2147483647) / 2147483647;

  if (alpha <= 0) return; x.save(); x.globalAlpha = clamp(alpha); x.fillStyle = Array.isArray(color) ? rgba(color, 1) : color;

}
/* a worm drawn from a list of points, head first */
function wormPts(pts, k, w, a = 1, pinch = 0) {

  x.globalCompositeOperation = 'lighter'; x.strokeStyle = rgba(k, .10 * a); x.lineWidth = w * 3.6; x.beginPath(); pts.forEach(([p, q], i) => i ? x.lineTo(p, q) : x.moveTo(p, q)); x.stroke();

/* a crawling worm: its body follows the path its head took a moment ago */
function trail(fn, t, n = 18, dt = .045) { const pts = []; for (let i = 0; i < n; i++) pts.push(fn(t - i * dt)); return pts; }

}

function lid(cx, cy, R, frac, k) { x.strokeStyle = '#141c2c'; x.lineWidth = 5; x.lineCap = 'round'; x.beginPath(); x.arc(cx, cy, R + 34, 0, 7); x.stroke(); x.strokeStyle = rgba(k, .95); x.beginPath(); x.arc(cx, cy, R + 34, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(frac)); x.stroke(); }

/* ── the film ─────────────────────────────────────────────────────────── */

    if (qa > 0) { x.save(); x.globalAlpha = qa; x.fillStyle = rgba(AMB, .08); x.fillRect(cx + 40, cy - 40, 200, 200); x.strokeStyle = rgba(AMB, .9); x.setLineDash([12, 9]); x.lineWidth = 3; x.strokeRect(cx + 40, cy - 40, 200, 200); x.setLineDash([]); x.restore(); }

    for (let k = 0; k < 14; k++) wormPts(trail(orbit(k + 60, cx, cy, R * .8), t + k, 14, .05), DAPI, 7, a * .8);
    eyebrow('RED', 160, 300, a, DAPI); text('Worms spread.', 154, 380, { size: 76, color: DAPI, alpha: a, spacing: -3 });
    text('Write the note your children inherit.', 160, 430, { size: 28, weight: 500, color: [179, 186, 203], alpha: a });
    eyebrow('BLUE', 1760, 300, a, [196, 184, 255], 'right'); text('Wardens push', 1766, 380, { size: 76, color: [196, 184, 255], alpha: a, spacing: -3, align: 'right' }); text('R below one.', 1766, 460, { size: 76, color: [196, 184, 255], alpha: a, spacing: -3, align: 'right' });

  }

    text('They built an AI worm. We made it pay rent.', 960, 640, { size: 46, weight: 600, align: 'center', alpha: a * seg(t, 26.4, 27), color: INK });
    text('PLAY RED VS BLUE', 960, 760, { size: 26, weight: 500, font: 'Plex', align: 'center', spacing: 6, alpha: a * seg(t, 27, 27.5), color: DAPI });
    text('Simulation only · every tick replays · not affiliated with the researchers', 960, 990, { size: 20, weight: 500, align: 'center', alpha: a * seg(t, 27.2, 27.8), color: [95, 103, 128] });
